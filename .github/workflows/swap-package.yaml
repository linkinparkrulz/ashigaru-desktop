name: Swap build

# Packages Ashigaru with the embedded swap engine inside, for testing swaps on the xmr-swap branch.
# Same packaging as the Package workflow; the only difference is the engine library, built by the
# Swap engine workflow and placed in the app's resources where JNA finds it.

on:
  push:
    branches: [xmr-swap]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  engine:
    uses: ./.github/workflows/swap-engine.yaml

  package:
    needs: engine
    # Package every platform whose engine built: a runner losing its network on one engine job
    # should not hold back the other three. A platform without an engine fails at its download.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact-name: Windows
            target: x86_64-pc-windows-gnu
            prefix: win32-x86-64
            lib: ashigaru_swap.dll
          - os: ubuntu-22.04
            artifact-name: Linux
            target: x86_64-unknown-linux-gnu
            prefix: linux-x86-64
            lib: libashigaru_swap.so
          - os: macos-latest
            artifact-name: macOS-arm64
            target: aarch64-apple-darwin
            prefix: darwin-aarch64
            lib: libashigaru_swap.dylib
          - os: macos-15-intel
            artifact-name: macOS-x64
            target: x86_64-apple-darwin
            prefix: darwin-x86-64
            lib: libashigaru_swap.dylib

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Stamp the build with its version
        shell: bash
        run: bash .github/scripts/set-build-version.sh "${{ github.run_number }}" "${{ github.sha }}"

      - name: Download the swap engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: swap-engine-${{ matrix.target }}
          path: engine

      # JNA looks for a bundled library under <os>-<arch>/ on the class path
      - name: Bundle the swap engine
        shell: bash
        run: |
          mkdir -p "src/main/resources/${{ matrix.prefix }}"
          # The library, and on Windows the MinGW runtime DLLs it needs
          cp engine/* "src/main/resources/${{ matrix.prefix }}/"
          ls -l "src/main/resources/${{ matrix.prefix }}"

      - name: Set up JDK 21 (21.0.13.1 or newer)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # The newest released Temurin 21; the next step stops the build if it is older than 21.0.13.1 (Java 21 security fix)
          java-version: 21
          check-latest: true

      - name: Require the patched Java runtime
        shell: bash
        run: bash .github/scripts/require-java.sh 21.0.13.1

      - name: Build installer (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: .\gradlew.bat jpackage

      - name: Build DMG (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: ./gradlew jpackage

      - name: Build AppImage (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew packageAppImage

      - name: Check the engine is in the app
        shell: bash
        run: |
          jar=$(find build/libs -name '*.jar' | head -1)
          unzip -l "$jar" | grep "${{ matrix.prefix }}/"
          unzip -l "$jar" | grep "${{ matrix.prefix }}/${{ matrix.lib }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ashigaru Swap Build - ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            build/jpackage/*.exe
            build/jpackage/*.dmg
            build/distributions/*.AppImage
