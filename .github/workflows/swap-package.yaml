name: Swap build

# Packages Ashigaru with the embedded swap engine inside, for testing swaps on the xmr-swap branch.
# Same packaging as the Package workflow; the only difference is the engine library, built by the
# Swap engine workflow and placed in the app's resources where JNA finds it.

on:
  push:
    branches: [xmr-swap]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  engine:
    uses: ./.github/workflows/swap-engine.yaml

  package:
    needs: engine
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact-name: Windows
            target: x86_64-pc-windows-gnu
            prefix: win32-x86-64
            lib: ashigaru_swap.dll
          - os: ubuntu-22.04
            artifact-name: Linux
            target: x86_64-unknown-linux-gnu
            prefix: linux-x86-64
            lib: libashigaru_swap.so
          - os: macos-latest
            artifact-name: macOS-arm64
            target: aarch64-apple-darwin
            prefix: darwin-aarch64
            lib: libashigaru_swap.dylib
          - os: macos-15-intel
            artifact-name: macOS-x64
            target: x86_64-apple-darwin
            prefix: darwin-x86-64
            lib: libashigaru_swap.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Download the swap engine
        uses: actions/download-artifact@v4
        with:
          name: swap-engine-${{ matrix.target }}
          path: engine

      # JNA looks for a bundled library under <os>-<arch>/ on the class path
      - name: Bundle the swap engine
        shell: bash
        run: |
          mkdir -p "src/main/resources/${{ matrix.prefix }}"
          cp "engine/${{ matrix.lib }}" "src/main/resources/${{ matrix.prefix }}/"
          ls -l "src/main/resources/${{ matrix.prefix }}"

      - name: Set up JDK 21.0.7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21.0.7

      - name: Build installer (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: .\gradlew.bat jpackage

      - name: Build DMG (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: ./gradlew jpackage

      - name: Build AppImage (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew packageAppImage

      - name: Check the engine is in the app
        shell: bash
        run: |
          jar=$(find build/libs -name '*.jar' | head -1)
          unzip -l "$jar" | grep "${{ matrix.prefix }}/${{ matrix.lib }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ashigaru Swap Build - ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            build/jpackage/*.exe
            build/jpackage/*.dmg
            build/distributions/*.AppImage
