name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21 (21.0.13.1 or newer)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # The newest released Temurin 21; the next step stops the build if it is older than 21.0.13.1 (Java 21 security fix)
          java-version: 21
          check-latest: true

      - name: Require the patched Java runtime
        shell: bash
        run: bash .github/scripts/require-java.sh 21.0.13.1

      # WhirlpoolServicesTest starts the JavaFX platform, which needs a display
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and test
        run: xvfb-run --auto-servernum ./gradlew test
