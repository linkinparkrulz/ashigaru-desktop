name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 (Temurin 21.0.13.1+2)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # Exactly Temurin 21.0.13.1+2 (Adoptium's semver for it), not whatever is newest: the next step still stops the build below 21.0.13.1
          java-version: '21.0.13+100000002.0.LTS'
          check-latest: false

      - name: Require the patched Java runtime
        shell: bash
        run: bash .github/scripts/require-java.sh 21.0.13.1

      # WhirlpoolServicesTest starts the JavaFX platform, which needs a display
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and test
        run: xvfb-run --auto-servernum ./gradlew test
