name: Package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      #One runner's network hiccup should not cancel the other platforms
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact-name: Windows
          - os: ubuntu-22.04
            artifact-name: Linux
          - os: macos-latest
            artifact-name: macOS-arm64
          - os: macos-15-intel
            artifact-name: macOS-x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21.0.7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21.0.7

      - name: Show Build Versions (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: .\gradlew.bat -v

      - name: Show Build Versions (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: ./gradlew -v

      - name: Build installer (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: .\gradlew.bat jpackage

      - name: Build DMG (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: ./gradlew jpackage

      - name: Build AppImage (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew packageAppImage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ashigaru Build - ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            build/jpackage/*.exe
            build/jpackage/*.dmg
            build/distributions/*.AppImage
