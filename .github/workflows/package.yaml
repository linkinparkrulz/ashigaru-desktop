name: Package

# Packages Ashigaru for every platform. Tick "Include the swap engine" to also build the native
# swap engine and bundle it, which is what makes Tools > Swaps appear; that adds about an hour.
on:
  workflow_dispatch:
    inputs:
      swap_engine:
        description: Include the swap engine (adds about an hour)
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Only when asked for. Skipped otherwise, and the build below goes ahead without it.
  engine:
    if: ${{ inputs.swap_engine }}
    uses: ./.github/workflows/swap-engine.yaml

  build:
    needs: engine
    # Run when the engine job was skipped, and for every platform whose engine did build: one
    # runner losing its network should not hold back the others. A platform asked to include an
    # engine that is missing fails at its download.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      #One runner's network hiccup should not cancel the other platforms
      fail-fast: false
      matrix:
        include:
          # target, prefix and lib locate the swap engine: the artifact it was built as, the
          # folder JNA looks in on the class path, and the library's file name
          - os: windows-2022
            artifact-name: Windows
            target: x86_64-pc-windows-gnu
            prefix: win32-x86-64
            lib: ashigaru_swap.dll
          - os: ubuntu-22.04
            artifact-name: Linux
            target: x86_64-unknown-linux-gnu
            prefix: linux-x86-64
            lib: libashigaru_swap.so
          - os: macos-15
            artifact-name: macOS-arm64
            target: aarch64-apple-darwin
            prefix: darwin-aarch64
            lib: libashigaru_swap.dylib
          - os: macos-15-intel
            artifact-name: macOS-x64
            target: x86_64-apple-darwin
            prefix: darwin-x86-64
            lib: libashigaru_swap.dylib

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp the build with its version
        shell: bash
        run: bash .github/scripts/set-build-version.sh "${{ github.run_number }}" "${{ github.sha }}"

      - name: Download the swap engine
        if: ${{ inputs.swap_engine }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: swap-engine-${{ matrix.target }}
          path: engine

      # JNA looks for a bundled library under <os>-<arch>/ on the class path
      - name: Bundle the swap engine
        if: ${{ inputs.swap_engine }}
        shell: bash
        run: |
          mkdir -p "src/main/resources/${{ matrix.prefix }}"
          # The library, and on Windows the MinGW runtime DLLs it needs
          cp engine/* "src/main/resources/${{ matrix.prefix }}/"
          ls -l "src/main/resources/${{ matrix.prefix }}"

      - name: Set up JDK 21 (Temurin 21.0.13.1+2)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # Exactly Temurin 21.0.13.1+2 (Adoptium's semver for it), not whatever is newest: the next step still stops the build below 21.0.13.1
          java-version: '21.0.13+100000002.0.LTS'
          check-latest: false

      - name: Require the patched Java runtime
        shell: bash
        run: bash .github/scripts/require-java.sh 21.0.13.1

      - name: Show Build Versions (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: .\gradlew.bat -v

      - name: Show Build Versions (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: ./gradlew -v

      - name: Build installer (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: .\gradlew.bat jpackage

      - name: Build DMG (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: ./gradlew jpackage

      - name: Build AppImage (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew packageAppImage

      - name: Check the engine is in the app
        if: ${{ inputs.swap_engine }}
        shell: bash
        run: |
          jar=$(find build/libs -name '*.jar' | head -1)
          unzip -l "$jar" | grep "${{ matrix.prefix }}/${{ matrix.lib }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ashigaru Build - ${{ matrix.artifact-name }}${{ inputs.swap_engine && ' (with swaps)' || '' }}
          if-no-files-found: error
          path: |
            build/jpackage/*.exe
            build/jpackage/*.dmg
            build/distributions/*.AppImage
