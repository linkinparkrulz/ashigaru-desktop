name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The swap engine is built here, in the release, from the pinned eigenwallet revision and Ashigaru's patches, and bundled into every package
  # below. If it does not build for a platform the release stops: a release must not ship without it, or with an engine from somewhere else.
  engine:
    uses: ./.github/workflows/swap-engine.yaml
    with:
      # A release builds with locked dependencies, or it does not build
      require_lock: true

  build:
    needs: engine
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # target, prefix and lib locate the swap engine: the artifact it was built as, the folder JNA looks in on the class path, and the library's file name
          - os: windows-2022
            artifact-name: Windows
            target: x86_64-pc-windows-gnu
            prefix: win32-x86-64
            lib: ashigaru_swap.dll
          - os: ubuntu-22.04
            artifact-name: Linux
            target: x86_64-unknown-linux-gnu
            prefix: linux-x86-64
            lib: libashigaru_swap.so
          - os: macos-15
            artifact-name: macOS-arm64
            target: aarch64-apple-darwin
            prefix: darwin-aarch64
            lib: libashigaru_swap.dylib
          - os: macos-15-intel
            artifact-name: macOS-x64
            target: x86_64-apple-darwin
            prefix: darwin-x86-64
            lib: libashigaru_swap.dylib

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21 (21.0.13.1 or newer)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # The newest released Temurin 21; the next step stops the build if it is older than 21.0.13.1 (Java 21 security fix)
          java-version: 21
          check-latest: true

      - name: Require the patched Java runtime
        shell: bash
        run: bash .github/scripts/require-java.sh 21.0.13.1

      - name: Download the swap engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: swap-engine-${{ matrix.target }}
          path: engine

      # JNA looks for a bundled library under <os>-<arch>/ on the class path
      - name: Bundle the swap engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "src/main/resources/${{ matrix.prefix }}"
          # The library, and on Windows the MinGW runtime DLLs it needs
          cp engine/* "src/main/resources/${{ matrix.prefix }}/"
          ls -l "src/main/resources/${{ matrix.prefix }}"
          test -f "src/main/resources/${{ matrix.prefix }}/${{ matrix.lib }}"

      - name: Extract version (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -Append $env:GITHUB_ENV

      - name: Extract version (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build installer (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: .\gradlew.bat jpackage

      - name: Build DMG (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: ./gradlew jpackage

      - name: Build AppImage (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew packageAppImage

      - name: Check the engine is in the app
        shell: bash
        run: |
          jar=$(find build/libs -name '*.jar' | head -1)
          unzip -l "$jar" | grep "${{ matrix.prefix }}/${{ matrix.lib }}"

      # The engine files are also release assets, named by platform so that no two share a name, so that they get the checksum manifest and the
      # build attestation like the packages do, and anyone can compare the library inside a package with the one the release names.
      - name: Collect the engine files as release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine-assets
          for file in engine/*; do
            # Only letters, digits, dot, underscore and dash: GitHub renames other characters in asset names (libstdc++-6.dll), and the
            # renamed asset would no longer match its line in SHA256SUMS
            name=$(printf '%s' "swap-engine-${{ matrix.target }}-$(basename "$file")" | LC_ALL=C sed 's/[^A-Za-z0-9._-]/_/g')
            cp "$file" "engine-assets/$name"
          done
          ls -l engine-assets

      - name: Rename macOS DMG (arm64)
        if: ${{ matrix.artifact-name == 'macOS-arm64' }}
        run: mv build/jpackage/*.dmg build/jpackage/Ashigaru-${VERSION}-aarch64.dmg

      - name: Rename macOS DMG (x64)
        if: ${{ matrix.artifact-name == 'macOS-x64' }}
        run: mv build/jpackage/*.dmg build/jpackage/Ashigaru-${VERSION}-x86_64.dmg

      # One package per platform: the .exe installer, a .dmg per macOS architecture and the AppImage.
      # The in-app updater (ReleaseArtifactSelector) expects exactly these.
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            build/jpackage/*.exe
            build/jpackage/*.dmg
            build/distributions/*.AppImage
            engine-assets/*

  validate-macos:
    needs: build
    runs-on: macos-latest

    steps:
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-macOS-*
          path: artifacts
          merge-multiple: true

      - name: Validate DMG bundle structure
        run: |
          set -euo pipefail
          validate_app() {
            local app="$1" label="$2"
            local plist="$app/Contents/Info.plist"
            echo "=== $label ==="
            [ -f "$plist" ] || { echo "FAIL: Info.plist missing"; exit 1; }
            EXEC=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$plist")
            echo "  CFBundleExecutable: $EXEC"
            [ -f "$app/Contents/MacOS/$EXEC" ] \
              || { echo "FAIL: Contents/MacOS/$EXEC not found"; exit 1; }
            MIN=$(/usr/libexec/PlistBuddy -c "Print LSMinimumSystemVersion" "$plist")
            echo "  LSMinimumSystemVersion: $MIN"
            [ "$MIN" = "11.0" ] || { echo "FAIL: expected 11.0, got $MIN"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$app" \
              || { echo "FAIL: codesign verify failed"; exit 1; }
            echo "  PASS"
          }
          # upload-artifact keeps the folders the files were in (build/jpackage/...), so look for them rather than assuming the top level,
          # and fail if there are none: a validation that finds nothing to validate must not pass.
          found=0
          while IFS= read -r dmg; do
            found=$((found + 1))
            mnt="/Volumes/AshigaruCheck-$(basename "$dmg" .dmg)"
            hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
            validate_app "$mnt/Ashigaru.app" "$(basename "$dmg")"
            hdiutil detach "$mnt" -quiet
          done < <(find artifacts -name 'Ashigaru-*.dmg' -type f | sort)
          [ "$found" -ge 1 ] || { echo "FAIL: no DMG found to validate"; exit 1; }

  release:
    needs: [build, validate-macos]
    runs-on: ubuntu-22.04
    # Only this job creates the draft release, so only it gets write access. The two extra permissions are for the
    # build attestation below: id-token lets GitHub sign it for this workflow run, attestations lets it be stored.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # Only the release artifacts: the engine's own artifacts (swap-engine-*) hold files with the same names for both macOS architectures
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets

          # upload-artifact roots each artifact at the least common ancestor of its path patterns,
          # so downloads arrive under distributions/ and jpackage/ rather than at the top level.
          # Release assets are flat, so record basenames - that is what a user downloads.
          # GitHub replaces characters other than letters, digits, dot, underscore and dash in asset names, so a file named with any
          # other is renamed here first: SHA256SUMS then lists exactly the names the release shows.
          while IFS= read -r -d '' file; do
            name=${file##*/}
            safe=$(printf '%s' "$name" | LC_ALL=C sed 's/[^A-Za-z0-9._-]/_/g')
            if [ "$safe" != "$name" ]; then
              if [ -e "${file%/*}/$safe" ]; then
                echo "Cannot rename $file to $safe: that name is taken" >&2
                exit 1
              fi
              echo "Renaming release asset $name to $safe"
              mv "$file" "${file%/*}/$safe"
            fi
          done < <(find . -type f -print0)

          tmp=$(mktemp)
          while IFS= read -r -d '' file; do
            name=${file##*/}
            case $name in
              SHA256SUMS|MESSAGE.txt|RELEASE-SIGNING-INSTRUCTIONS.txt|RELEASE-BIP47-SIGNATURE.txt) continue ;;
            esac
            printf '%s  %s\n' "$(sha256sum "$file" | awk '{print $1}')" "$name" >> "$tmp"
          done < <(find . -type f -print0)

          if [ ! -s "$tmp" ]; then
            echo "No release artifacts found under release-assets/ to checksum" >&2
            exit 1
          fi

          dupes=$(awk '{print $2}' "$tmp" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Artifacts share a basename and would collide as release assets:" >&2
            echo "$dupes" >&2
            exit 1
          fi

          sort -k2 "$tmp" > SHA256SUMS
          rm -f "$tmp"
          cat SHA256SUMS

      - name: Generate MESSAGE.txt
        run: |
          cd release-assets
          SUMS_HASH=$(sha256sum SHA256SUMS | awk '{print $1}')
          printf '%s\n' \
            "Ashigaru release attestation" \
            "Repo: github.com/linkinparkrulz/ashigaru-desktop" \
            "Version: ${VERSION}" \
            "Tag: ${GITHUB_REF_NAME}" \
            "Commit: ${GITHUB_SHA}" \
            "SHA256(SHA256SUMS): ${SUMS_HASH}" \
            > MESSAGE.txt

      - name: Generate release signing instructions
        run: |
          cd release-assets
          cat > RELEASE-SIGNING-INSTRUCTIONS.txt <<'EOF'
          Release signing instructions

          These steps produce RELEASE-BIP47-SIGNATURE.txt, which Ashigaru checks before it will install
          an update. From 1.3.0 onward a release published without it, or with a signature that does not
          verify, is refused by every user's in-app updater. Upload the signature BEFORE publishing.

          1. Download MESSAGE.txt from this draft release.

          2. Sign the exact contents of MESSAGE.txt with the private key for the notification address
             derived from this BIP47 Payment Code:

             PM8TJM51x2mDd85CzEgVc2y7vdyB3eBj93JVjVtCt6PZtmfzhFzYPMXYBXh28zthWhVKGjVQZPT1MKxGxEtfenLYEkuc5GhoWtMzQCF8c8mrckYFM7r1

             That code derives to notification address 1K8CDoBYWBuaeAhejLAk5hiACAgbbPnDCJ. Your signing
             tool should report that same address.

          3. Save the signed message block your tool produces as RELEASE-BIP47-SIGNATURE.txt. It looks
             like this:

             -----BEGIN BITCOIN SIGNED MESSAGE-----
             (the exact contents of MESSAGE.txt)
             -----BEGIN BITCOIN SIGNATURE-----
             Address: 1K8CDoBYWBuaeAhejLAk5hiACAgbbPnDCJ

             (base64 signature)
             -----END BITCOIN SIGNATURE-----

             Paste the block exactly as the tool emits it. Do not retype or reflow the message: the
             signature covers it byte for byte, and a single changed character breaks verification.

          4. Verify your own signature before publishing. In Ashigaru, open Tools -> Verifier,
             click "Use Release Signing Code", paste the whole block into the signed message
             box, then choose Verify Message. It must report the recovered signer as
             1K8CDoBYWBuaeAhejLAk5hiACAgbbPnDCJ.

          5. Upload RELEASE-BIP47-SIGNATURE.txt to this draft release.

          6. Confirm the release carries SHA256SUMS, MESSAGE.txt and RELEASE-BIP47-SIGNATURE.txt, then
             publish it. A draft is invisible to the updater, which only sees published, non-prerelease
             releases.

          If your signing tool emits only a bare base64 signature rather than a whole block, a file
          containing the message followed by a "Signature:" line and the signature is also accepted.
          Prefer the block above: it carries the message and the signature together, so the two cannot
          be mismatched.
          EOF

      # A signed record, kept by GitHub, of which workflow, commit and runner produced each release file. Anyone can check
      # one with:  gh attestation verify <file> --repo linkinparkrulz/ashigaru-desktop
      # It shows what built the file, not that anyone endorses it (the release signature below covers who published it).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/**

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Ashigaru ${{ env.VERSION }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release-assets/**
