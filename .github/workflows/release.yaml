name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            artifact-name: Windows
          - os: ubuntu-22.04
            artifact-name: Linux
          - os: macos-latest
            artifact-name: macOS-arm64
          - os: macos-15-intel
            artifact-name: macOS-x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21.0.7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21.0.7

      - name: Extract version (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -Append $env:GITHUB_ENV

      - name: Extract version (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build installer (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: .\gradlew.bat jpackage

      - name: Build DMG (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: ./gradlew jpackage

      - name: Build AppImage (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew packageAppImage

      - name: Rename macOS DMG (arm64)
        if: ${{ matrix.artifact-name == 'macOS-arm64' }}
        run: mv build/jpackage/*.dmg build/jpackage/Ashigaru-${VERSION}-aarch64.dmg

      - name: Rename macOS DMG (x64)
        if: ${{ matrix.artifact-name == 'macOS-x64' }}
        run: mv build/jpackage/*.dmg build/jpackage/Ashigaru-${VERSION}-x86_64.dmg

      # One package per platform: the .exe installer, a .dmg per macOS architecture and the AppImage.
      # The in-app updater (ReleaseArtifactSelector) expects exactly these.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            build/jpackage/*.exe
            build/jpackage/*.dmg
            build/distributions/*.AppImage

  validate-macos:
    needs: build
    runs-on: macos-latest

    steps:
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-macOS-*
          path: artifacts
          merge-multiple: true

      - name: Validate DMG bundle structure
        run: |
          set -euo pipefail
          validate_app() {
            local app="$1" label="$2"
            local plist="$app/Contents/Info.plist"
            echo "=== $label ==="
            [ -f "$plist" ] || { echo "FAIL: Info.plist missing"; exit 1; }
            EXEC=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$plist")
            echo "  CFBundleExecutable: $EXEC"
            [ -f "$app/Contents/MacOS/$EXEC" ] \
              || { echo "FAIL: Contents/MacOS/$EXEC not found"; exit 1; }
            MIN=$(/usr/libexec/PlistBuddy -c "Print LSMinimumSystemVersion" "$plist")
            echo "  LSMinimumSystemVersion: $MIN"
            [ "$MIN" = "11.0" ] || { echo "FAIL: expected 11.0, got $MIN"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$app" \
              || { echo "FAIL: codesign verify failed"; exit 1; }
            echo "  PASS"
          }
          for dmg in artifacts/Ashigaru-*.dmg; do
            [ -f "$dmg" ] || continue
            mnt="/Volumes/AshigaruCheck-$(basename "$dmg" .dmg)"
            hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
            validate_app "$mnt/Ashigaru.app" "$(basename "$dmg")"
            hdiutil detach "$mnt" -quiet
          done

  release:
    needs: [build, validate-macos]
    runs-on: ubuntu-22.04

    steps:
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets

          # upload-artifact roots each artifact at the least common ancestor of its path patterns,
          # so downloads arrive under distributions/ and jpackage/ rather than at the top level.
          # Release assets are flat, so record basenames - that is what a user downloads.
          tmp=$(mktemp)
          while IFS= read -r -d '' file; do
            name=${file##*/}
            case $name in
              SHA256SUMS|MESSAGE.txt|RELEASE-SIGNING-INSTRUCTIONS.txt|RELEASE-BIP47-SIGNATURE.txt) continue ;;
            esac
            printf '%s  %s\n' "$(sha256sum "$file" | awk '{print $1}')" "$name" >> "$tmp"
          done < <(find . -type f -print0)

          if [ ! -s "$tmp" ]; then
            echo "No release artifacts found under release-assets/ to checksum" >&2
            exit 1
          fi

          dupes=$(awk '{print $2}' "$tmp" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Artifacts share a basename and would collide as release assets:" >&2
            echo "$dupes" >&2
            exit 1
          fi

          sort -k2 "$tmp" > SHA256SUMS
          rm -f "$tmp"
          cat SHA256SUMS

      - name: Generate MESSAGE.txt
        run: |
          cd release-assets
          SUMS_HASH=$(sha256sum SHA256SUMS | awk '{print $1}')
          printf '%s\n' \
            "Ashigaru release attestation" \
            "Repo: github.com/linkinparkrulz/ashigaru-desktop" \
            "Version: ${VERSION}" \
            "Tag: ${GITHUB_REF_NAME}" \
            "Commit: ${GITHUB_SHA}" \
            "SHA256(SHA256SUMS): ${SUMS_HASH}" \
            > MESSAGE.txt

      - name: Generate release signing instructions
        run: |
          cd release-assets
          cat > RELEASE-SIGNING-INSTRUCTIONS.txt <<'EOF'
          Release signing instructions

          These steps produce RELEASE-BIP47-SIGNATURE.txt, which Ashigaru checks before it will install
          an update. From 1.3.0 onward a release published without it, or with a signature that does not
          verify, is refused by every user's in-app updater. Upload the signature BEFORE publishing.

          1. Download MESSAGE.txt from this draft release.

          2. Sign the exact contents of MESSAGE.txt with the private key for the notification address
             derived from this BIP47 Payment Code:

             PM8TJM51x2mDd85CzEgVc2y7vdyB3eBj93JVjVtCt6PZtmfzhFzYPMXYBXh28zthWhVKGjVQZPT1MKxGxEtfenLYEkuc5GhoWtMzQCF8c8mrckYFM7r1

             That code derives to notification address 1K8CDoBYWBuaeAhejLAk5hiACAgbbPnDCJ. Your signing
             tool should report that same address.

          3. Save the signed message block your tool produces as RELEASE-BIP47-SIGNATURE.txt. It looks
             like this:

             -----BEGIN BITCOIN SIGNED MESSAGE-----
             (the exact contents of MESSAGE.txt)
             -----BEGIN BITCOIN SIGNATURE-----
             Address: 1K8CDoBYWBuaeAhejLAk5hiACAgbbPnDCJ

             (base64 signature)
             -----END BITCOIN SIGNATURE-----

             Paste the block exactly as the tool emits it. Do not retype or reflow the message: the
             signature covers it byte for byte, and a single changed character breaks verification.

          4. Verify your own signature before publishing. In Ashigaru, open Tools -> Verifier,
             click "Use Release Signing Code", paste the whole block into the signed message
             box, then parse and verify. It must report the recovered signer as
             1K8CDoBYWBuaeAhejLAk5hiACAgbbPnDCJ.

          5. Upload RELEASE-BIP47-SIGNATURE.txt to this draft release.

          6. Confirm the release carries SHA256SUMS, MESSAGE.txt and RELEASE-BIP47-SIGNATURE.txt, then
             publish it. A draft is invisible to the updater, which only sees published, non-prerelease
             releases.

          If your signing tool emits only a bare base64 signature rather than a whole block, a file
          containing the message followed by a "Signature:" line and the signature is also accepted.
          Prefer the block above: it carries the message and the signature together, so the two cannot
          be mismatched.
          EOF

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Ashigaru ${{ env.VERSION }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release-assets/**
